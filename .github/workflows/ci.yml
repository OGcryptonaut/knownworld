name: CI

on: [push, pull_request]

jobs:
  agents:
    name: agents (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r requirements.txt
      # tests/conftest.py sets FAKE_LLM=1 and FAKE_FIRESTORE=1 before app.config
      # is imported: no GCP, no model keys, no network.
      - run: python -m pytest -q

  web:
    name: web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Advisory until the v3 screen rewrite lands: the v2 screens
      # (src/app/requests/page.tsx, src/components/ThemeProvider.tsx,
      # src/components/database/{DatabaseGraph,DatabaseMap,DetailPanel}.tsx,
      # src/components/onboarding/{DistillStep,ResearchStep}.tsx) carry
      # pre-existing react-hooks lint errors and are being replaced wholesale,
      # not patched. Drop the continue-on-error once the rewrite is merged.
      # tsc, tests and build below stay hard gates.
      - run: npm run lint
        continue-on-error: true
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test
      - run: npm run build

  data:
    name: data (demo corpus parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The wizard serves web/public/demo-corpus.json same-origin; it must be
      # the byte-identical copy of the canonical export. agents/ seeds its ATS
      # slug table from a copy of data/ats-slugs.json.
      - run: cmp sample-data/result.json web/public/demo-corpus.json
      - run: cmp data/ats-slugs.json agents/app/seed/ats-slugs.json
      # generate.py is deterministic (seed 42, --now anchor, stdlib only, no
      # network): a fresh run must reproduce all three committed files exactly.
      - run: |
          mkdir -p "$RUNNER_TEMP/gen"
          python3 sample-data/generate.py --now 2026-09-26T12:00:00 --out "$RUNNER_TEMP/gen/result.json"
          for f in result.json demo-knowledge.json expected-people.json; do
            cmp "sample-data/$f" "$RUNNER_TEMP/gen/$f"
          done
